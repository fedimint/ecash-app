[package]
name = "ecashapp"
version = "0.11.0-alpha"
edition = "2021"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
async-stream = "0.3.6"
async-trait = "0.1.88"
bitcoin = { version = "0.32.5", features = ["serde"] }
bitcoin-payment-instructions = { version = "0.4.0", features = [ "http" ]}
# Fedimint is pinned to the branch of fedimint#9093, which adds the walletv2
# `pending_outputs` API the guardians use to report mempool and confirmation
# progress for peg-ins. Until that PR lands (and 0.13 is published) these come
# from the PR branch rather than crates.io; the whole set moves together
# because the fedimint crates only interoperate at a matching version.
# Branch: m1sterc001guy/fedimint@walletv2_confirmations
fedimint-api-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-bip39 = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-core = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-fountain = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-eventlog = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-connectors = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-derive-secret = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-rocksdb = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-ln-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-lnv2-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-lnv2-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-ln-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-meta-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-mint-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-mint-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-mintv2-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-mintv2-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-wallet-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-wallet-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-walletv2-client = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
fedimint-walletv2-common = { git = "https://github.com/m1sterc001guy/fedimint", rev = "9e159fd31b59b8d1b7dd844d753fe935ceb18114" }
hex = "0.4"
flutter_rust_bridge = "=2.9.0"
futures-timer = "3.0.3"
futures-util = "0.3.30"
lightning-invoice = { version = "0.33.2", features = ["std"] } # Needs to match fedimint's lightning-invoice
lnurl-rs = { version = "0.9.0", default-features = false }
nostr-sdk = { version = "0.42.0", features = [ "nip04" ]}
regex = "1.11.1"
reqwest = { version = "0.12.18", features = [
  "rustls-tls",
  "json",
], default-features = false }
semver = "1.0.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
subtle = "2.6.1"
thiserror = "1.0"
tokio = "1.45.1"

# The tokio features the tests need (`#[tokio::test]`, `tokio::time::timeout`).
# They happen to be enabled today by feature unification with fedimint-core;
# declaring them here keeps the test suite from depending on that accident.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

# Android-only. `iroh` (fedimint's guardian transport) pulls in native
# networking crates — `hickory-resolver` (DNS) and `netdev` — that, since the
# hickory 0.26 / netdev 0.44 upgrade, read the device network config through
# `ndk_context`. Flutter loads our .so via Dart `dlopen`, which never runs
# `JNI_OnLoad`, so nothing initializes that context. We do it ourselves in
# src/android_init.rs using these crates. See that file for the full story.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

[profile.dev.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3}
secp256k1-sys = { opt-level = 3}
# Argon2 hashes the PIN on every unlock. Unoptimized it takes seconds, not
# milliseconds, and the cost is paid on the user's critical path.
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = false
debug = "line-tables-only"

[profile.release.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3}
secp256k1-sys = { opt-level = 3}
# The release profile optimizes for size (`opt-level = "z"`), which is the wrong
# trade for a KDF that runs while the user waits at the lock screen.
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }

# Fast development builds that are still usable (crypto code needs optimization)
# Use via: cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[profile.release-dev.package]
librocksdb-sys = { opt-level = 3 }
secp256k1 = { opt-level = 3 }
secp256k1-sys = { opt-level = 3 }
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
