# Adapted from fedimint's rule of the same name. Tests for `src/foo.rs` go in
# `src/foo/tests.rs`, declared with `#[cfg(test)] mod tests;` (see AGENTS.md).
id: no-inline-modules
language: rust
severity: error
message: Inline module bodies are not allowed; preserve the module’s attributes and visibility, move its body to the Rust-resolved standalone module file, and replace `{ ... }` with `;`.
rule:
  kind: mod_item
  has:
    kind: declaration_list
    stopBy: neighbor
files:
  - 'rust/**/*.rs'
ignores:
  # Generated by flutter_rust_bridge_codegen.
  - 'rust/ecashapp/src/frb_generated.rs'
